name: Update Version in __init__.py

on:
  workflow_call:
    inputs:
      package_path:
        description: 'Path to the package directory containing __init__.py'
        required: true
        type: string
      pushed_tag:
        description: 'The tag that was pushed'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-version-in-init:
    if: github.actor != 'centura-tagger[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Get token to push directly to develop
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.CENTURA_TAGGER_APP_ID }}
          private-key: ${{ vars.CENTURA_TAGGER_APP_PK }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get the branch name from the tag
        id: get-branch
        run: |
          # Get the commit hash of the tag
          TAG_COMMIT=$(git rev-list -n 1 "${{ inputs.pushed_tag }}")
          echo "Tag commit: $TAG_COMMIT"

          # Try to find a branch containing this commit
          BRANCH_NAME=$(git branch -r --contains "$TAG_COMMIT" | grep -E 'origin/(develop|main|master)' | head -n 1 | sed 's/origin\///')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Detected branch: $BRANCH_NAME"

      - name: Switch to detected branch
        if: steps.get-branch.outputs.branch != ''
        run: |
          git checkout ${{ steps.get-branch.outputs.branch }}
          echo "Now on branch $(git branch --show-current)"

      - name: Extract version from tag
        id: extract_version
        run: |
          NEW_VERSION="${{ inputs.pushed_tag }}"
          echo "version=${NEW_VERSION#v}" >> $GITHUB_ENV

      - name: Get current version from __init__.py
        id: get_current_version
        run: |
          CURRENT_VERSION=$(grep -oP '__version__ = "\K[^"]+' "${{ inputs.package_path }}/__init__.py")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Check if new version is larger than current version
        id: check_tags
        run: |
          # Compare the versions using shell sorting for semantic versioning
          NEW_VERSION="${{ env.version }}"
          CURRENT_VERSION="${{ env.current_version }}"
          
          echo "Current Version:  $CURRENT_VERSION"
          echo "New Version:      $NEW_VERSION"

          if [[ "$(printf '%s\n' "$NEW_VERSION" "$CURRENT_VERSION" | sort -V | tail -n 1)" != "$NEW_VERSION" ]]; then
            echo "Error: Version $NEW_VERSION is not larger than the current version in __init__.py"
            exit 1
          fi

      - name: Update __init__.py with new version
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ env.version }}\"/g" "${{ inputs.package_path }}/__init__.py"
          cat "${{ inputs.package_path }}/__init__.py"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "centura-tagger[bot]"
          git config --global user.email "centura-tagger[bot]@users.noreply.github.com"
          git switch ${{ steps.get-branch.outputs.branch }}
          git add "${{ inputs.package_path }}/__init__.py"
          git commit -m "chore: update __version__ to ${{ env.version }}"
          echo "STATUS ============"
          git status
          echo "TAG =========="
          git push origin ${{ steps.get-branch.outputs.branch }}
          git tag -fa ${{ inputs.pushed_tag }} -m "${{ inputs.pushed_tag }}"
          git push origin ${{ steps.get-branch.outputs.branch }} --tags --force
