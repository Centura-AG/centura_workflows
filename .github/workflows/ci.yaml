name: Frappe CI

on:
  workflow_call:
    inputs:
      app_path:
        description: 'Path to your app'
        required: true
        type: string
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        type: string
        default: 'version-16'
      erpnext_branch:
        description: 'ERPNext branch to install'
        required: false
        type: string
        default: 'version-16'
      hrms_branch:
        description: 'HRMS branch to install'
        required: false
        type: string
        default: 'version-16'
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.14'
      node_version:
        description: 'Node version to use'
        required: false
        type: string
        default: '24'
      additional_apps:
        description: 'Space-separated list of additional apps to install (format: org/repo org/repo)'
        required: false
        type: string
        default: ''
      helper_repo:
        description: 'Repository containing helper scripts (format: org/repo)'
        required: false
        type: string
        default: 'Centura-AG/centura_workflows'
      helper_branch:
        description: 'Branch of helper repository'
        required: false
        type: string
        default: 'develop'
    secrets:
      CENTURA_TAGGER_APP_PK:
        description: 'Private key for the GitHub App to access private repos'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check_tests.outputs.has_tests }}

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Check for tests
        id: check_tests
        run: |
          if grep -rq --include="*.py" "def test" "${GITHUB_WORKSPACE}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests found, skipping test run"
          fi

  tests:
    name: Python Unit Tests
    needs: checks
    if: needs.checks.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: 'production'

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Get GitHub App token for private repos
        if: inputs.additional_apps != ''
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.CENTURA_TAGGER_APP_ID }}
          private-key: ${{ secrets.CENTURA_TAGGER_APP_PK }}
          owner: ${{ github.repository_owner }}

      - name: Get helper scripts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/.github/helper/
          curl -f -o ${GITHUB_WORKSPACE}/.github/helper/install.sh https://raw.githubusercontent.com/${{ inputs.helper_repo }}/${{ inputs.helper_branch }}/.github/helper/install.sh
          curl -f -o ${GITHUB_WORKSPACE}/.github/helper/site_config.json https://raw.githubusercontent.com/${{ inputs.helper_repo }}/${{ inputs.helper_branch }}/.github/helper/site_config.json
          chmod +x ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe_branch }}
          ERPNEXT_BRANCH: ${{ inputs.erpnext_branch }}
          HRMS_BRANCH: ${{ inputs.hrms_branch }}
          APP_NAME: ${{ github.event.repository.name }}
          ADDITIONAL_APPS: ${{ inputs.additional_apps }}
          ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ${{ inputs.app_path }}
        env:
          TYPE: server
