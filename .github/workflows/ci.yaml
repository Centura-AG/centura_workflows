name: Frappe CI

on:
  workflow_call:
    inputs:
      app_path:
        description: 'Path to your app'
        required: true
        type: string
      frappe_branch:
        description: 'Frappe branch to test against'
        required: false
        type: string
        default: 'version-16'
      erpnext_branch:
        description: 'ERPNext branch to install'
        required: false
        type: string
        default: 'version-16'
      hrms_branch:
        description: 'HRMS branch to install'
        required: false
        type: string
        default: 'version-16'
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.14'
      node_version:
        description: 'Node version to use'
        required: false
        type: string
        default: '24'
      install_apps:
        description: >-
          Frappe-stack apps to install on the test site: 'erpnext hrms' (default),
          'erpnext', or 'none' (frappe only). hrms implies erpnext; payments is
          installed automatically with erpnext.
        required: false
        type: string
        default: 'erpnext hrms'
      additional_apps:
        description: 'Space-separated list of additional apps to install (format: org/repo org/repo)'
        required: false
        type: string
        default: ''
      use_bench_cache:
        description: >-
          Cache the built bench (clones, venv, assets) and a dump of the test-site
          database for a week and restore them on subsequent runs. Biggest win for
          repos that install erpnext/hrms. The BENCH_CACHE_VERSION repository
          variable busts the cache manually.
        required: false
        type: boolean
        default: false
      helper_repo:
        description: 'Repository containing helper scripts (format: org/repo)'
        required: false
        type: string
        default: 'Centura-AG/centura_workflows'
      helper_branch:
        description: 'Escape hatch: fetch install.sh/site_config.json from this ref of helper_repo instead of the scripts embedded in this workflow'
        required: false
        type: string
        default: ''
    secrets:
      CENTURA_TAGGER_APP_PK:
        description: 'Private key for the GitHub App to access private repos'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Sanity Checks
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.check_tests.outputs.has_tests }}

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Check for tests
        id: check_tests
        run: |
          if grep -rq --include="*.py" "def test" "${GITHUB_WORKSPACE}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No tests found, skipping test run"
          fi

  tests:
    name: Python Unit Tests
    needs: checks
    if: needs.checks.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: 'production'

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Get GitHub App token for private repos
        if: inputs.additional_apps != ''
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.CENTURA_TAGGER_APP_ID }}
          private-key: ${{ secrets.CENTURA_TAGGER_APP_PK }}
          owner: ${{ github.repository_owner }}

      - name: Write helper scripts
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/.github/helper/
          if [ -n "${{ inputs.helper_branch }}" ]; then
            echo "Fetching helper scripts from ${{ inputs.helper_repo }}@${{ inputs.helper_branch }}"
            curl -f -o ${GITHUB_WORKSPACE}/.github/helper/install.sh "https://raw.githubusercontent.com/${{ inputs.helper_repo }}/${{ inputs.helper_branch }}/.github/helper/install.sh"
            curl -f -o ${GITHUB_WORKSPACE}/.github/helper/site_config.json "https://raw.githubusercontent.com/${{ inputs.helper_repo }}/${{ inputs.helper_branch }}/.github/helper/site_config.json"
          else
          cat > ${GITHUB_WORKSPACE}/.github/helper/install.sh <<'INSTALL_SH_EOF'
          #!/bin/bash

          set -e

          cd ~ || exit

          sudo systemctl stop mysql || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcups2-dev redis-server mariadb-client libmariadb-dev libcairo2-dev

          pip install frappe-bench

          githubbranch=${GITHUB_BASE_REF:-${GITHUB_REF##*/}}
          frappebranch=${FRAPPE_BRANCH:-$githubbranch}
          erpnextbranch=${ERPNEXT_BRANCH:-$githubbranch}
          hrmsbranch=${HRMS_BRANCH:-$githubbranch}
          paymentsbranch=${PAYMENTS_BRANCH:-$frappebranch}

          stackapps=${INSTALL_APPS:-"erpnext hrms"}
          if [ "$stackapps" = "none" ]; then stackapps=""; fi
          with_erpnext=false
          with_hrms=false
          for token in $stackapps; do
              case "$token" in
                  erpnext) with_erpnext=true ;;
                  hrms) with_hrms=true; with_erpnext=true ;;
                  *) echo "Unknown install_apps token: '$token' (allowed: erpnext, hrms, none)"; exit 1 ;;
              esac
          done

          install_whktml() {
              wget -O /tmp/wkhtmltox.tar.xz https://github.com/frappe/wkhtmltopdf/raw/master/wkhtmltox-0.12.3_linux-generic-amd64.tar.xz
              tar -xf /tmp/wkhtmltox.tar.xz -C /tmp
              sudo mv /tmp/wkhtmltox/bin/wkhtmltopdf /usr/local/bin/wkhtmltopdf
              sudo chmod o+x /usr/local/bin/wkhtmltopdf
          }
          install_whktml &

          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "CREATE USER 'test_frappe'@'localhost' IDENTIFIED BY 'test_frappe'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "CREATE DATABASE test_frappe"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON \`test_frappe\`.* TO 'test_frappe'@'localhost'"

          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "FLUSH PRIVILEGES"

          get_additional_apps() {
              if [ -n "$ADDITIONAL_APPS" ]; then
                  for app in $ADDITIONAL_APPS; do
                      if [ -n "$ACCESS_TOKEN" ]; then
                          app_url="https://x-access-token:${ACCESS_TOKEN}@github.com/$app"
                      else
                          app_url="https://github.com/$app"
                      fi
                      rm -rf "apps/$(basename "$app")"
                      bench get-app "$app_url" --branch "$githubbranch" || bench get-app "$app_url"
                      app_dir="apps/$(basename "$app")"
                      git -C "$app_dir" remote set-url "$(git -C "$app_dir" remote | head -n1)" "https://github.com/$app"
                  done
              fi
          }

          if [ "$BENCH_CACHE_HIT" = "true" ] && [ ! -f ~/frappe-bench/site_dump.sql.gz ]; then
              echo "Restored bench cache has no site_dump.sql.gz - rebuilding from scratch"
              rm -rf ~/frappe-bench
              BENCH_CACHE_HIT=""
          fi

          if [ "$BENCH_CACHE_HIT" = "true" ]; then
              echo "Bench cache hit - restoring test site from dump"
              cd ~/frappe-bench || exit

              gunzip -c site_dump.sql.gz | mariadb --host 127.0.0.1 --port 3306 -u root -proot test_frappe

              get_additional_apps

              rm -rf "apps/${APP_NAME}"
              bench get-app "$APP_NAME" "${GITHUB_WORKSPACE}"

              bench setup requirements --dev

              bench start &>> ~/frappe-bench/bench_start.log &
          else
              git clone "https://github.com/frappe/frappe" --branch "${frappebranch}" --depth 1
              bench init --skip-assets --frappe-path ~/frappe --python "$(which python)" frappe-bench

              mkdir ~/frappe-bench/sites/test_site
              cp -r "${GITHUB_WORKSPACE}/.github/helper/site_config.json" ~/frappe-bench/sites/test_site/

              cd ~/frappe-bench || exit

              sed -i 's/watch:/# watch:/g' Procfile
              sed -i 's/schedule:/# schedule:/g' Procfile
              sed -i 's/socketio:/# socketio:/g' Procfile
              sed -i 's/redis_socketio:/# redis_socketio:/g' Procfile

              if [ "$with_erpnext" = true ]; then
                  bench get-app "https://github.com/frappe/payments" --branch "$paymentsbranch" # To satisfy dependencies of erpnext payment_request.py
                  bench get-app "https://github.com/frappe/erpnext" --branch "$erpnextbranch" --resolve-deps
              fi
              if [ "$with_hrms" = true ]; then
                  bench get-app "https://github.com/frappe/hrms" --branch "$hrmsbranch"
              fi

              get_additional_apps

              bench get-app "$APP_NAME" "${GITHUB_WORKSPACE}"

              bench setup requirements --dev

              bench start &>> ~/frappe-bench/bench_start.log &
              CI=Yes bench build --app frappe & build_pid=$!
              bench --site test_site reinstall --yes

              if [ "$with_erpnext" = true ]; then
                  bench --verbose --site test_site install-app payments
                  bench --verbose --site test_site install-app erpnext
              fi
              if [ "$with_hrms" = true ]; then
                  bench --verbose --site test_site install-app hrms
              fi

              if [ "$USE_BENCH_CACHE" = "true" ]; then
                  wait "$build_pid" || true
                  echo "Dumping test site database for bench cache"
                  mariadb-dump --host 127.0.0.1 --port 3306 -u root -proot --single-transaction --quick --default-character-set=utf8mb4 test_frappe | gzip > site_dump.sql.gz
              fi
          fi

          bench --verbose --site test_site install-app "$APP_NAME"

          if [ -n "$ADDITIONAL_APPS" ]; then
              for app in $ADDITIONAL_APPS; do
                  app_name=$(basename "$app")
                  bench --verbose --site test_site install-app "$app_name"
              done
          fi
          INSTALL_SH_EOF
          cat > ${GITHUB_WORKSPACE}/.github/helper/site_config.json <<'SITE_CONFIG_EOF'
          {
              "db_host": "127.0.0.1",
              "db_port": 3306,
              "db_name": "test_frappe",
              "db_password": "test_frappe",
              "use_mysqlclient": 1,
              "auto_email_id": "test@centura.ch",
              "mail_server": "smtp.centura.ch",
              "mail_login": "test@centura.ch",
              "mail_password": "test",
              "admin_password": "admin",
              "root_login": "root",
              "root_password": "root",
              "host_name": "http://test_site:8000",
              "throttle_user_limit": 100
          }
          SITE_CONFIG_EOF
          fi
          chmod +x ${GITHUB_WORKSPACE}/.github/helper/install.sh

      - name: Compute cache week
        id: cache-week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ steps.cache-week.outputs.week }}-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ steps.cache-week.outputs.week }}-
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Compute bench cache key
        id: bench-key
        if: inputs.use_bench_cache
        run: |
          apps_slug=$(echo "${INSTALL_APPS:-none}" | tr -cs 'a-zA-Z0-9' '-')
          echo "key=bench-v${BENCH_CACHE_VERSION:-1}-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-node${{ inputs.node_version }}-${{ inputs.frappe_branch }}-${{ inputs.erpnext_branch }}-${{ inputs.hrms_branch }}-${apps_slug}-${{ steps.cache-week.outputs.week }}" >> "$GITHUB_OUTPUT"
        env:
          BENCH_CACHE_VERSION: ${{ vars.BENCH_CACHE_VERSION }}
          INSTALL_APPS: ${{ inputs.install_apps }}

      - name: Restore bench cache
        id: bench-cache
        if: inputs.use_bench_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/frappe-bench
          key: ${{ steps.bench-key.outputs.key }}

      - name: Install
        run: |
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          FRAPPE_BRANCH: ${{ inputs.frappe_branch }}
          ERPNEXT_BRANCH: ${{ inputs.erpnext_branch }}
          HRMS_BRANCH: ${{ inputs.hrms_branch }}
          INSTALL_APPS: ${{ inputs.install_apps }}
          APP_NAME: ${{ github.event.repository.name }}
          ADDITIONAL_APPS: ${{ inputs.additional_apps }}
          ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
          USE_BENCH_CACHE: ${{ inputs.use_bench_cache }}
          BENCH_CACHE_HIT: ${{ steps.bench-cache.outputs.cache-hit }}

      - name: Save bench cache
        if: inputs.use_bench_cache && steps.bench-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/frappe-bench
          key: ${{ steps.bench-key.outputs.key }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench/
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ${{ inputs.app_path }}
        env:
          TYPE: server
